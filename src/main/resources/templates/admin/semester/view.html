<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <table class="table table-striped">
    <thead>
    <tr>
        <th>Season</th>
        <th>Year</th>
        <th>Starts At</th>
        <th>Ends At</th>
        <th>Registration deadline</th>
        <th>Active</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="semester : ${semesters}">
        <td th:text="${semester.name}"></td>
        <td th:text="${semester.year}"></td>
        <td th:text="${semester.startsAt}"></td>
        <td th:text="${semester.endsAt}"></td>
        <td th:text="${semester.registrationDeadline.replace('T', ' ')}"></td>
        <td th:text="${semester.active}"></td>
    </tr>
    </tbody>
</table>
    <div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/semesters/view', emptyMessage='No semesters found.')}"></div>
</body>
</html>
