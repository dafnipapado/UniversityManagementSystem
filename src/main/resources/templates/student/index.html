<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href=@{/css/global.css}>
    <title>Dashboard - CatBridge</title>
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div th:if="${successMessage}">
    <p th:text="${successMessage}"></p>
</div>
<div class="d-flex flex-column gap-3 w-15 text-center ms-3 mt-3">
    <a th:href="@{/students/edit/{uuid}(uuid=${studentReadOnlyDTO.uuid})}" class="reverse-btn text-decoration-none">
        Edit
    </a>
    <a th:href="@{/course-offerings/view}" class="submit-btn text-decoration-none">
        View course offerings
    </a>

</div>
</body>
</html>
