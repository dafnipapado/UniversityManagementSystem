<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Manage Teachers - CatBridge</title>
</head>
<body>
    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <div class="container w-70 mt-5">
        <a th:href="@{/teachers/create}" class="reverse-btn text-decoration-none">
            <span class="fa-solid fa-chalkboard-user"></span> Add a new teacher
        </a>

        <table class="table mt-5 align-middle">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Teacher AM</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr class="h-93px" th:classappend="${teacher.deleted} ? 'deleted-row' : ''" th:each="teacher : ${teachers}">
                    <td th:text="${teacher.firstname}"></td>
                    <td th:text="${teacher.lastname}"></td>
                    <td th:text="${teacher.teacherAM}"></td>
                    <td class="w-8">
                        <a th:href="@{/teachers/edit/{uuid}(uuid=${teacher.uuid})}" class=" text-decoration-none">
                            <span class="fa-regular fa-pen-to-square submit-btn px-2"></span>
                        </a>
                        <form class="d-inline-block" method="post" th:action="@{/teachers/delete/{uuid}(uuid=${teacher.uuid})}">
                            <button type="submit" class=" submit-btn px-2 py-1">
                                <span class="fa-regular fa-trash-can"></span>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
    </table>
    </div>

    <div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/teachers/view', emptyMessage='No teachers found.')}"></div>

</body>
</html>
