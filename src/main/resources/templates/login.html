<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/global.css}" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Login</title>
</head>
<body class="login-bg min-vh-100">

<div class="main-content bg-transparent min-h-screen flex items-center justify-center p-4 min-vh-100">
    <form th:action="@{/login}" method="POST"
          class="w-30 h-50 max-w-md p-8 position-absolute top-50 start-50 translate-middle d-flex flex-column
          justify-content-center align-items-center gap-4 border rounded-2 login-form-bg">
        <div class="text-white fs-2 fw-semibold mb-3">University of Catbridge <span class="fa-solid fa-shield-cat"></span></div>
        <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autofocus
                required
                class="w-50 px-3 py-2 border rounded-3"
        >
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                class="w-50 px-3 py-2 border rounded-3"
        >
        <button
                type="submit"
                class="w-25 submit-btn mt-3"
        >
            Sign In
        </button>
    </form>
</div>
</body>
</html>
