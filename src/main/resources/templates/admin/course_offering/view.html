<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Course offerings</title>
</head>
<body>

<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container w-70 mt-5">

    <a th:href="@{/course-offerings/create}" class="reverse-btn text-decoration-none">
        <span class="fa-solid fa-book"></span> Add a new course offering
    </a>

    <table class="table mt-5 align-middle">
        <thead>
            <tr>
                <th>Course code</th>
                <th>Course name</th>
                <th>Teacher firstname</th>
                <th>Teacher lastname</th>
                <th>Season</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr class="h-93px" th:each="courseOffering : ${courseOfferings}">
                <td class="w-15" th:text="${courseOffering.courseReadOnlyDTO.code}"></td>
                <td class="w-20" th:text="${courseOffering.courseReadOnlyDTO.name}"></td>
                <td class="w-20" th:text="${courseOffering.teacherReadOnlyDTO.firstname}"></td>
                <td class="w-20" th:text="${courseOffering.teacherReadOnlyDTO.lastname}"></td>
                <td class="w-8" th:text="${courseOffering.semesterReadOnlyDTO.name}"></td>
                <td class="w-8" th:text="${courseOffering.semesterReadOnlyDTO.year}"></td>
                <td class="w-8">
                    <a th:href="@{/course-offerings/edit/{uuid}(uuid=${courseOffering.uuid})}" class="text-decoration-none">
                        <span class="fa-regular fa-pen-to-square submit-btn px-2"></span>
                    </a>
                    <form class="d-inline-block" method="post" th:action="@{/course-offerings/delete/{uuid}(uuid=${courseOffering.uuid})}">
                        <button type="submit" class=" submit-btn px-2 py-1">
                            <span class="fa-regular fa-trash-can"></span>
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/course-offerings/admin-view', emptyMessage='No course offerings found.')}"></div>
</body>
</html>
