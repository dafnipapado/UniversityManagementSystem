<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create New Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<div class="container mt-5 main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="card-title mb-0">Sign up</h2>
                </div>

                <div th:if="${errorMessage}" class="error">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="card-body">
                    <form method="post" th:object="${courseInsertDTO}" th:action="@{/courses/create}" >
                        <div class="mb-3">
                            <label class="form-label">Code</label>
                            <input type="text" class="form-control" th:field="*{code}" required>
                            <div th:if="${#fields.hasErrors('code')}">
                                <p th:classappend="${#fields.hasErrors('code')} ? 'error'" th:errors="*{code}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                            <div th:if="${#fields.hasErrors('name')}">
                                <p th:classappend="${#fields.hasErrors('name')} ? 'error'" th:errors="*{name}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" th:field="*{description}" required></textarea>
                            <div th:if="${#fields.hasErrors('description')}">
                                <p th:classappend="${#fields.hasErrors('description')} ? 'error'" th:errors="*{description}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ects</label>
                            <input type="number" class="form-control" th:field="*{ects}" required>
                            <div th:if="${#fields.hasErrors('ects')}">
                                <p th:classappend="${#fields.hasErrors('ects')} ? 'error'" th:errors="*{ects}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label th:for="departmentId" class="form-label">Department</label>
                            <select th:field="*{departmentId}" class="form-select" id="departmentId" required>
                                <option value="" selected>Select Department</option>
                                <option th:each="department : ${departmentsReadOnlyDTO}" th:value="${department.id}" th:text="${department.name}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('departmentId')}">
                                <p th:classappend="${#fields.hasErrors('departmentId')} ? 'error'" th:errors="*{departmentId}"></p>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
