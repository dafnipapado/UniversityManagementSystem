<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <form
            action="post"
            th:action="@{/teachers/edit}"
            th:object="${teacherEditDTO}"
    >
        <input type="hidden" th:field="*{uuid}" />

        <div class="row">
            <div class="col-lg-6 min-height-100">
                <label th:for="*{firstname}" class="form-label"></label><br>
                <input type="text" th:field="*{firstname}" class="form-control" required />
            </div>
            <div class="col-lg-3 min-height-100">
                <label th:for="*{lastname}" class="form-label">Lastname</label>
                <input type="text" th:field="*{lastname}" class="form-control" required/>
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="*{username}" class="form-label">Username</label>
                <input type="text" th:field="*{username}" class="form-control" required />
            </div>
            <div class="col-lg-3 min-height-100">
                <label th:for="*{password}" class="form-label">Password</label>
                <input type="password" th:field="*{password}" class="form-control" required />
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="*{email}" class="form-label">Email</label>
                <input type="text" th:field="*{email}" class="form-control" required />
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="*{teacherAM}" class="form-label">Teacher AM</label>
                <input type="text" th:field="*{teacherAM}" class="form-control" required />
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="*{amf}" class="form-label">Afm</label>
                <input type="text" th:field="*{afm}" class="form-control" required />
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="*{telephone}" class="form-label">Telephone number</label>
                <input type="text" th:field="*{telephone}" class="form-control" required />
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="*{zipCode}" class="form-label">Zip Code</label>
                <input type="text" th:field="*{zipCode}" class="form-control" required />
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="regionId" class="form-label">Region</label>
                <select th:field="*{regionId}" id="regionId" class="form-select" required>
                    <option value="" selected>Select Region</option>
                    <option value="${regionId}" th:each="region: ${regionsReadOnlyDTO}" th:text="${region.name}"></option>
                </select>
            </div>
        </div>

    </form>
</body>
</html>
