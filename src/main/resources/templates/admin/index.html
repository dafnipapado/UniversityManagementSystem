<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Admin dashboard</title>
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <div th:if="${successMessage}">
        <p th:text="${successMessage}"></p>
    </div>
    <br>

    <div class="container w-70">
        <div class="row mb-4">
            <div class="col-6">
                <div class="card">
                    <img th:src="@{/images/course-offerings.png}" class="card-img-top h-30" alt="course offerings picture">
                    <div class="card-body text-center mx-5">
                        <div class="card-title  fs-3 text-primary-green">Course Offerings</div>
                        <div class="card-text d-flex flex-column mb-3 text-start">
                            <div><span class="fw-semibold">Active offerings: </span><span th:text="${courseOfferingsCount}"></span></div>
                            <div th:if="${latestCourseOffering != null}"><span class="fw-semibold">Last added:</span>
                                <span th:text="${latestCourseOffering.courseCode}"></span> -
                                <span th:text="${latestCourseOffering.courseName}"></span>
                                (<span th:text="${latestCourseOffering.semesterName}"></span>
                                <span th:text="${latestCourseOffering.semesterYear}"></span>)
                            </div>
                        </div>
                        <a th:href="@{/course-offerings/admin-view}" class="submit-btn text-decoration-none">
                            Manage course offerings
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card">
                    <img th:src="@{/images/courses.png}" class="card-img-top h-30" alt="courses picture">
                    <div class="card-body text-center">
                        <div class="card-title fw-semibold fs-3">Courses</div>
                        <div class="card-text d-flex flex-column mb-3">
                            <div>Courses: <span th:text="${coursesCount}"></span></div>
                            <div th:if="${latestCourse != null}">Last added:
                                <span th:text="${latestCourse.code}"></span> -
                                <span th:text="${latestCourse.name}"></span>
                            </div>
                        </div>
                        <a th:href="@{/courses/view}" class="submit-btn text-decoration-none">
                            Manage courses
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-6">
                <div class="card">
                    <img th:src="@{/images/semesters.jpg}" class="card-img-top h-30" alt="semesters picture">
                    <div class="card-body text-center">
                        <div class="card-title fw-semibold fs-3">Semesters</div>
                        <div class="card-text d-flex flex-column mb-3">
                            <div th:if="${activeSemester != null}">Active semester:
                                <span th:text="${activeSemester.name}"></span>
                                <span th:text="${activeSemester.year}"></span>
                            </div>
                        </div>
                        <a th:href="@{/semesters/view}" class="submit-btn text-decoration-none">
                            Manage semesters
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <div class="card">
                    <img th:src="@{/images/teachers.jpg}" class="card-img-top h-30" alt="teachers picture">
                    <div class="card-body text-center">
                        <div class="card-title fw-semibold fs-3">Teachers</div>
                        <div class="card-text d-flex flex-column mb-3">
                            <div>Teachers: <span th:text="${teachersCount}"></span></div>
                            <div th:if="${latestTeacher != null}">Last added:
                                <span th:text="${latestTeacher.firstname}"></span>
                                <span th:text="${latestTeacher.lastname}"></span>
                            </div>
                        </div>
                        <a th:href="@{/teachers/view}" class="submit-btn text-decoration-none">
                            Manage teachers
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card">
                    <img th:src="@{/images/students.jpg}" class="card-img-top" alt="students picture">
                    <div class="card-body text-center">
                        <div class="card-title fw-semibold fs-3">Students</div>
                        <div class="card-text d-flex flex-column mb-3">
                            <div>Students: <span th:text="${studentsCount}"></span></div>
                            <div th:if="${latestStudent != null}">Last added:
                                <span th:text="${latestStudent.firstname}"></span>
                                <span th:text="${latestStudent.lastname}"></span>
                            </div>
                        </div>
                        <a th:href="@{/students/view}" class="submit-btn text-decoration-none">
                            Manage students
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a th:href="@{/users/create}" class="btn btn-light btn-lg px-4 btn-success-custom">
        <i class="bi bi-person-plus me-2"></i>Add a new user
    </a>

</body>
</html>
