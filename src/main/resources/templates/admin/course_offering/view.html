<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Manage Course offerings - CatBridge</title>
</head>
<body>

<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container w-70 mt-5">

    <a th:href="@{/course-offerings/create}" class="reverse-btn text-decoration-none">
        <span class="fa-solid fa-book"></span> Add a new course offering
    </a>

    <table class="table mt-5 align-middle">
        <thead>
        <tr>
            <th>Course code</th>
            <th>Course name</th>
            <th>Teacher</th>
            <th>Semester</th>
            <th>Examination</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr class="h-93px" th:classappend="${courseOffering.deleted} ? 'deleted-row' : ''"
            th:each="courseOffering : ${courseOfferings}">
            <td class="w-15" th:text="${courseOffering.courseReadOnlyDTO.code}"></td>
            <td class="w-20" th:text="${courseOffering.courseReadOnlyDTO.name}"></td>
            <td class="w-20">
                <span th:text="${courseOffering.teacherReadOnlyDTO.firstname}"></span>
                <span th:text="${courseOffering.teacherReadOnlyDTO.lastname}"></span>
            </td>
            <td class="w-15">
                <span th:text="${courseOffering.semesterReadOnlyDTO.name}"></span>
                <span th:text="${courseOffering.semesterReadOnlyDTO.year}"></span>
            </td>
            <td class="w-15">
                <div th:if="${examinationsByOffering.containsKey(courseOffering.uuid)}"
                     class="d-flex align-items-center gap-2">
                    <span th:text="${examinationsByOffering[courseOffering.uuid].examinationDate}"></span>
                    <!--examination info button-->
                    <a class="text-primary-green cursor-pointer" data-bs-toggle="modal"
                       th:data-bs-target="'#modal-' + ${courseOffering.uuid}">
                        <span class="bi bi-info-circle"></span>
                    </a>
                    <div class="modal fade" th:id="'modal-' + ${courseOffering.uuid}" tabindex="-1"
                         th:aria-labelledby="'modal-label-' + ${courseOffering.uuid}" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered max-w-22">
                            <div class="modal-content">
                                <div class="modal-header bg-primary-green text-white">
                                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Examination Details</h1>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                </div>
                                <div class="modal-body h-12rem d-flex flex-column justify-content-around text-size-1_125rem">
                                    <div class="d-flex justify-content-between border-bottom border-grey py-1">
                                        <span class="fw-semibold">Examination Date</span>
                                        <span th:text="${examinationsByOffering[courseOffering.uuid].examinationDate}"></span>
                                    </div>
                                    <div class="d-flex justify-content-between border-bottom border-grey py-1">
                                        <span class="fw-semibold">Start Time</span>
                                        <span th:text="${examinationsByOffering[courseOffering.uuid].startTime} ?: 'No time set'"></span>
                                    </div>
                                    <div class="d-flex justify-content-between border-bottom border-grey py-1">
                                        <span class="fw-semibold">Duration (minutes)</span>
                                        <span th:text="${examinationsByOffering[courseOffering.uuid].duration}"></span>
                                    </div>
                                    <div class="d-flex justify-content-between py-1">
                                        <span class="fw-semibold">Passing Grade</span>
                                        <span th:text="${examinationsByOffering[courseOffering.uuid].passingGrade}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--examination edit button-->
                    <a th:href="@{/examinations/edit/{courseOfferingUuid}(courseOfferingUuid=${courseOffering.uuid})}">
                        <span class="fa-solid fa-pencil fa-sm text-primary-green cursor-pointer"></span>
                    </a>
                </div>
                <div th:unless="${examinationsByOffering.containsKey(courseOffering.uuid)}">
                    <a th:href="@{/examinations/create/{courseOfferingUuid}(courseOfferingUuid=${courseOffering.uuid})}">
                        Add examination
                    </a>
                </div>
            </td>
            <td class="w-8">
                <a th:href="@{/course-offerings/edit/{uuid}(uuid=${courseOffering.uuid})}" class="text-decoration-none">
                    <span class="fa-regular fa-pen-to-square submit-btn px-2"></span>
                </a>
                <form class="d-inline-block" method="post"
                      th:action="@{/course-offerings/delete/{uuid}(uuid=${courseOffering.uuid})}">
                    <button type="submit" class=" submit-btn px-2 py-1">
                        <span class="fa-regular fa-trash-can"></span>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/course-offerings/admin-view', emptyMessage='No course offerings found.')}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>
</html>
