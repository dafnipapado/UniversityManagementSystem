<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href=@{/css/global.css}>
    <title>Course Offerings - CatBridge</title>
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <div class="row mt-3 ms-3">
        <div th:each="courseOffering : ${courseOfferings}">
            <div class="col-sm-4 mb-3 mb-sm-0">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title fw-semibold" th:text="${courseOffering.courseReadOnlyDTO.code} + ' - ' + ${courseOffering.courseReadOnlyDTO.name}"></h5>
                        <p class="card-text" th:text="${courseOffering.teacherReadOnlyDTO.teacherAM} + ' - ' + ${courseOffering.teacherReadOnlyDTO.firstname} + ' ' + ${courseOffering.teacherReadOnlyDTO.lastname}"></p>
                        <p class="card-text" th:text="${courseOffering.semesterReadOnlyDTO.name} + ' ' + ${courseOffering.semesterReadOnlyDTO.year}"></p>
                            <form method="post" th:action="@{/course-offerings/enroll/{uuid}(uuid=${courseOffering.uuid})}">
                                <button type="submit" class="submit-btn w-100"
                                        th:classappend="${courseOffering.isStudentEnrolled ? 'btn-secondary' : 'btn-primary'}"
                                        th:disabled="${courseOffering.isStudentEnrolled}">Enroll
                                </button>
                            </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/course-offerings/view', emptyMessage='No active course offerings found.')}"></div>

</body>
</html>
