<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <form
            method="post"
            th:action="@{/students/edit}"
            th:object="${studentEditDTO}"
    >
        <input type="hidden" th:field="*{uuid}" />

        <div class="row">
            <div class="col-lg-6 min-height-100">
                <label class="form-label"></label><br>
                <input type="text" th:field="*{userInfoEditDTO.firstname}" class="form-control" required />
                <div th:if="${#fields.hasErrors('userInfoEditDTO.firstname')}">
                    <p th:classappend="${#fields.hasErrors('userInfoEditDTO.firstname')} ? 'error'" th:errors="*{userInfoEditDTO.firstname}"></p>
                </div>
            </div>
            <div class="col-lg-3 min-height-100">
                <label class="form-label">Lastname</label>
                <input type="text" th:field="*{userInfoEditDTO.lastname}" class="form-control" required/>
                <div th:if="${#fields.hasErrors('userInfoEditDTO.lastname')}">
                    <p th:classappend="${#fields.hasErrors('userInfoEditDTO.lastname')} ? 'error'" th:errors="*{userInfoEditDTO.lastname}"></p>
                </div>
            </div>
            <div class="col-lg-6 min-height-100">
                <label class="form-label">Username</label>
                <input type="text" th:field="*{userEditDTO.username}" class="form-control" required />
                <div th:if="${#fields.hasErrors('userEditDTO.username')}">
                    <p th:classappend="${#fields.hasErrors('userEditDTO.username')} ? 'error'" th:errors="*{userEditDTO.username}"></p>
                </div>
            </div>
            <div class="col-lg-3 min-height-100">
                <label class="form-label">Password</label>
                <input type="password" th:field="*{userEditDTO.password}" class="form-control" required />
                <div th:if="${#fields.hasErrors('userEditDTO.password')}">
                    <p th:classappend="${#fields.hasErrors('userEditDTO.password')} ? 'error'" th:errors="*{userEditDTO.password}"></p>
                </div>
            </div>
            <div class="col-lg-6 min-height-100">
                <label class="form-label">Email</label>
                <input type="text" th:field="*{userInfoEditDTO.email}" class="form-control" required />
                <div th:if="${#fields.hasErrors('userInfoEditDTO.email')}">
                    <p th:classappend="${#fields.hasErrors('userInfoEditDTO.email')} ? 'error'" th:errors="*{userInfoEditDTO.email}"></p>
                </div>
            </div>
            <div class="col-lg-6 min-height-100">
                <label class="form-label">Student AM</label>
                <input type="text" th:field="*{studentAM}" class="form-control" required />
                <div th:if="${#fields.hasErrors('studentAM')}">
                    <p th:classappend="${#fields.hasErrors('studentAM')} ? 'error'" th:errors="*{studentAM}"></p>
                </div>
            </div>
            <div class="col-lg-6 min-height-100">
                <label class="form-label">Afm</label>
                <input type="text" th:field="*{userInfoEditDTO.afm}" class="form-control" required />
                <div th:if="${#fields.hasErrors('userInfoEditDTO.afm')}">
                    <p th:classappend="${#fields.hasErrors('userInfoEditDTO.afm')} ? 'error'" th:errors="*{userInfoEditDTO.afm}"></p>
                </div>
            </div>
            <div class="col-lg-6 min-height-100">
                <label class="form-label">Telephone number</label>
                <input type="text" th:field="*{userInfoEditDTO.telephone}" class="form-control" required />
                <div th:if="${#fields.hasErrors('userInfoEditDTO.telephone')}">
                    <p th:classappend="${#fields.hasErrors('userInfoEditDTO.telephone')} ? 'error'" th:errors="*{userInfoEditDTO.telephone}"></p>
                </div>
            </div>
            <div class="col-lg-6 min-height-100">
                <label class="form-label">Zip Code</label>
                <input type="text" th:field="*{userInfoEditDTO.zipCode}" class="form-control" required />
                <div th:if="${#fields.hasErrors('userInfoEditDTO.zipCode')}">
                    <p th:classappend="${#fields.hasErrors('userInfoEditDTO.zipCode')} ? 'error'" th:errors="*{userInfoEditDTO.zipCode}"></p>
                </div>
            </div>
            <div class="col-lg-6 min-height-100">
                <label th:for="regionId" class="form-label">Region</label>
                <select th:field="*{userInfoEditDTO.regionId}" id="regionId" class="form-select" required>
                    <option value="" selected>Select Region</option>
                    <option th:each="region : ${regionsReadOnlyDTO}"
                            th:value="${region.id}"
                            th:text="${region.name}"
                            th:selected="${region.id==studentEditDTO.userInfoEditDTO.regionId}">
                    </option>
                </select>
                <div th:if="${#fields.hasErrors('userInfoEditDTO.regionId')}">
                    <p th:classappend="${#fields.hasErrors('userInfoEditDTO.regionId')} ? 'error'" th:errors="*{userInfoEditDTO.regionId}"></p>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-outline-light">Save</button>
    </form>
</body>
</html>
