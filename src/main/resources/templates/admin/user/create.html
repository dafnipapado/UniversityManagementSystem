<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href=@{/css/global.css}>
    <title>Create User - CatBridge</title>
</head>
<body>

<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container mt-5 main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary-green text-white">
                    <div class="card-title fs-3 mb-0">Create a user</div>
                </div>
                <div class="card-body">
                    <form
                        method="post"
                        th:action="@{/users/create}"
                        th:object="${userInsertDTO}"
                    >
                        <div class="mb-3">
                            <label th:for="username" class="form-label">Username</label><br>
                            <input type="text" th:field="*{username}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label th:for="password" class="form-label">Password</label><br>
                            <input type="password" th:field="*{password}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label th:for="role" class="form-label">Role</label><br>
                            <select id="role" th:field="*{roleId}" class="form-select" required>
                                <option value="" selected>Choose a role</option>
                                <option th:each="role : ${roleReadOnlyDTO}" th:text="${role.name}"
                                        th:value="${role.id}"></option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="submit-btn">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
