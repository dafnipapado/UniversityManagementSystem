<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href=@{/css/global.css}>
    <title>Dashboard - CatBridge</title>
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div th:if="${successMessage}">
    <p th:text="${successMessage}"></p>
</div>
<div class="d-flex flex-column gap-3 w-15 text-center ms-3 mt-3">
    <a th:href="@{/students/edit/{uuid}(uuid=${studentReadOnlyDTO.uuid})}" class="reverse-btn text-decoration-none">
        Edit
    </a>
    <a th:href="@{/course-offerings/view}" class="submit-btn text-decoration-none">
        View course offerings
    </a>
</div>

<div class="container w-70">

    <div class="fs-2 fw-semibold">
        Hello, <span th:text="${studentReadOnlyDTO.firstname}"></span> 👋
    </div>
    <hr/>

    <div class="row p-4 mb-3">
        <div class="col-12 col-md-4">
            <div th:replace="~{fragments/stat :: statFragment('journals', 'Classes', ${courseOfferingsCount})}"></div>
        </div>
        <div class="col-12 col-md-4">
            <div th:replace="~{fragments/stat :: statFragment('bar-chart-line', 'Total ECTs/Semester', ${totalEcts})}"></div>
        </div>
        <div class="col-12 col-md-4">
            <div th:replace="~{fragments/stat :: statFragment('calendar-week', 'Total Hours/Week', ${totalHours})}"></div>
        </div>
    </div>

    <div class="accordion pt-5 pb-5">
        <details class="accordion-item" name="accordionExample" open>
            <summary
                    class="accordion-header h-4rem d-flex justify-content-between align-items-center border-bottom border-grey ps-4 pe-4 mb-3"
                    style="list-style:none;">
                <div class="d-flex fw-semibold gap-3">
                    <div class="fs-4 text-primary-green">My Courses</div>
                    <div class="fs-5 text-secondary mt-1">
                        (<span th:text="${currentSemester.name}"></span>
                        <span th:text="${currentSemester.year}"></span>)
                    </div>
                </div>
                <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16"
                     height="16" color="silver" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="m2 5 6 6 6-6"/>
                </svg>
            </summary>
            <div class="accordion-body">
                <div class="row g-3">
                    <div class="col-6 ps-4 pe-4" th:each="courseOffering : ${courseOfferingsEnrolled}">
                        <div class="card course-card mb-3 h-10rem">
                            <div class="card-title course-title-card bg-primary-green text-white lh-3rem fw-semibold fs-5 ps-3 rounded-top-start"
                                 th:text="${courseOffering.courseReadOnlyDTO.name}">
                            </div>
                            <div class="d-flex justify-content-between">
                                <div class="card-body d-flex flex-column justify-content-center gap-1 text-size-1_05rem">
                                    <div class="d-flex gap-2">
                                        <span>Course code: </span>
                                        <div class="text-accent fw-bold"
                                             th:text="${courseOffering.courseReadOnlyDTO.code}"></div>
                                    </div>
                                    <div class="d-flex text-primary-green gap-4 m-1 w-75">
                                        <div class="d-flex gap-2 align-items-center flex-fill border-end">
                                            <span class="fw-semibold">ECTS:</span>
                                            <span th:text="${courseOffering.courseReadOnlyDTO.ects}"
                                                  class="fw-bold"></span>
                                        </div>
                                        <div class="d-flex gap-2 align-items-center flex-fill border-end">
                                            <i class="bi bi-clock-fill"></i>
                                            <span th:text="${courseOffering.courseReadOnlyDTO.hoursPerWeek}"
                                                  class="fw-bold"></span>
                                        </div>
                                        <div class="flex-fill">
                                            <span class="bi bi-person-video3 text-size-1_2rem"></span>
                                            <span th:text="${courseOffering.teacherReadOnlyDTO.firstname}"
                                                  class="fw-bold ms-1"></span>
                                            <span th:text="${courseOffering.teacherReadOnlyDTO.lastname}"
                                                  class="fw-bold"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="align-content-center pe-3">
                                    <a href="#" class="view-course-btn text-decoration-none text-center">
                                        <span class="bi bi-eye"></span>
                                    </a>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </details>
    </div>
</div>

</body>
</html>
