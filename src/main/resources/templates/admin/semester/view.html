<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Manage Semesters - CatBridge</title>
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <div class="container w-70 mt-5">
        <a th:href="@{/semesters/create}" class="reverse-btn text-decoration-none">
            <span class="fa-solid fa-calendar-days"></span> Add a new semester
        </a>

        <table class="table mt-5 align-middle">
            <thead>
                <tr>
                    <th>Season</th>
                    <th>Year</th>
                    <th>Starts At</th>
                    <th>Ends At</th>
                    <th>Registration deadline</th>
                    <th>Active</th>
                    <th>Activate</th>
                </tr>
            </thead>
            <tbody>
                <tr class="h-93px" th:each="semester : ${semesters}">
                    <td th:text="${semester.name}"></td>
                    <td th:text="${semester.year}"></td>
                    <td th:text="${semester.startsAt}"></td>
                    <td th:text="${semester.endsAt}"></td>
                    <td th:text="${semester.registrationDeadline.replace('T', ' ')}"></td>
                    <td th:text="${semester.active}"></td>
                    <td>
                        <div th:if="${semester.active}">
                            <button class="disable-btn" disabled>Activated</button>
                        </div>
                        <div th:unless="${semester.active}">
                            <form method="post" th:action="@{/semesters/{uuid}/activate(uuid=${semester.uuid})}">
                                <button type="submit" class="submit-btn">Activate</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/semesters/view', emptyMessage='No semesters found.')}"></div>
</body>
</html>
