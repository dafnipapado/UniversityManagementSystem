<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Teacher AM</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="teacher : ${teachers}">
                <td th:text="${teacher.firstname}"></td>
                <td th:text="${teacher.lastname}"></td>
                <td th:text="${teacher.teacherAm}"></td>
                <td>
                    <a th:href="@{/teachers/edit/{uuid}(uuid=${teacher.uuid})}">
                        <button class="btn btn-light">Edit</button>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination-controls">
        <div th:if="${page.first} AND ${!(page.hasContent)}">No teachers found.</div>

        <a th:if="${!page.first}" th:href="@{/teachers/view(page=0, size=${page.size})}">&laquo;</a>
        <span th:if="${page.first}" class="disabled">&laquo;</span>

        <a th:if="${!page.first}" th:href="@{/teachers/view(page=${page.number - 1}, size=${page.size})}">&lsaquo;</a>
        <span th:if="${page.first}" class="disabled">&lsaquo;</span>

        <a th:href="@{/teachers/view(page=${page.number}, size=${page.size})}" th:text="${page.number + 1}"></a>

        <a th:if="${!page.last}" th:href="/teachers/view(page=${page.number + 1}, size=${page.size})">&rsaquo;</a>
        <span th:if="${page.last}" class="disabled">&rsaquo;</span>

        <a th:if="${!page.last}" th:href="/teachers/view(page=${page.total - 1}, size=${page.size})">&raquo;</a>
        <span th:if="${page.last}" class="disabled">&raquo;</span>
    </div>
</body>
</html>
