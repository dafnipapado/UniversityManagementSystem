<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<div class="container mt-5 main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="card-title mb-0" th:text="'Withdraw a student from course offering: ' + ${courseOfferingUuid}"></h2>
                </div>

                <div th:if="${errorMessage}" class="error">
                    <p th:text="${errorMessage}"></p>
                </div>

                <form
                        method="post"
                        th:action="@{/course-offerings/{courseOfferingUuid}/student-withdraw(courseOfferingUuid = ${courseOfferingUuid})}"
                >
                    <input type="hidden" th:field="*{courseOfferingUuid}" />
                    <div class="col-lg-6 min-height-100">
                        <label class="form-label">Student AM</label><br>
                        <input type="text" name="studentAM" class="form-control" required />
                    </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Remove</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
