<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Edit Course - CatBridge</title>
</head>
<body>

<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container mt-5 main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary-green text-white">
                    <div class="card-title fs-3 mb-0">Edit</div>
                </div>
                <div class="card-body">
                    <form
                            method="post"
                            th:action="@{/courses/edit}"
                            th:object="${courseEditDTO}"
                    >
                        <input type="hidden" th:field="*{uuid}"/>

                        <div class="mb-3">
                            <label class="form-label">Code</label><br>
                            <input type="text" th:field="*{code}" class="form-control" required/>
                            <div th:if="${#fields.hasErrors('code')}">
                                <p th:classappend="${#fields.hasErrors('code')} ? 'error'" th:errors="*{code}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" th:field="*{name}" class="form-control" required/>
                            <div th:if="${#fields.hasErrors('name')}">
                                <p th:classappend="${#fields.hasErrors('name')} ? 'error'" th:errors="*{name}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" required></textarea>
                            <div th:if="${#fields.hasErrors('description')}">
                                <p th:classappend="${#fields.hasErrors('description')} ? 'error'"
                                   th:errors="*{description}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ects</label>
                            <input type="number" th:field="*{ects}" class="form-control" required/>
                            <div th:if="${#fields.hasErrors('ects')}">
                                <p th:classappend="${#fields.hasErrors('ects')} ? 'error'" th:errors="*{ects}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label th:for="departmentId" class="form-label">Department</label>
                            <select th:field="*{departmentId}" id="departmentId" class="form-select" required>
                                <option value="" selected>Select Department</option>
                                <option th:each="department : ${departmentsReadOnlyDTO}"
                                        th:value="${department.id}"
                                        th:text="${department.name}"
                                        th:selected="${department.id==courseEditDTO.departmentId}">
                                </option>
                            </select>
                            <div th:if="${#fields.hasErrors('departmentId')}">
                                <p th:classappend="${#fields.hasErrors('departmentId')} ? 'error'"
                                   th:errors="*{departmentId}"></p>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="submit-btn">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
