<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Teacher AM</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="teacher : ${teachers}">
                <td th:text="${teacher.firstname}"></td>
                <td th:text="${teacher.lastname}"></td>
                <td th:text="${teacher.teacherAM}"></td>
                <td>
                    <a th:href="@{/teachers/edit/{uuid}(uuid=${teacher.uuid})}">
                        <button class="btn btn-light">Edit</button>
                    </a>
                    <form method="post" th:action="@{/teachers/delete/{uuid}(uuid=${teacher.uuid})}">
                        <button type="submit" class="btn btn-light">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/teachers/view', emptyMessage='No teachers found.')}"></div>

</body>
</html>
