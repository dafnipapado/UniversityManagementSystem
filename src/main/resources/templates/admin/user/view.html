<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Manage Users - CatBridge</title>
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container w-70 mt-5">
    <a th:href="@{/users/create}" class="reverse-btn text-decoration-none">
        <span class="fa-solid fa-user-plus"></span> Add a new user
    </a>

    <table class="table mt-5 align-middle">
        <thead>
        <tr>
            <th>Username</th>
            <th>Role</th>
        </tr>
        </thead>
        <tbody>
        <tr class="h-93px" th:each="user : ${users}">
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/users/view', emptyMessage='No users found.')}"></div>

</body>
</html>
