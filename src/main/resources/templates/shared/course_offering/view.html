    <title>Document</title>

<body>
    <div sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/course-offerings/create}" class="btn btn-light btn-lg px-4 btn-success-custom">
            <i class="bi bi-person-plus me-2"></i>Add a new course offering
        </a>
    </div>


    <div class="row">
        <div th:each="courseOffering : ${courseOfferings}">
            <div class="col-sm-4 mb-3 mb-sm-0">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${courseOffering.courseReadOnlyDTO.code} + ' - ' + ${courseOffering.courseReadOnlyDTO.name}"></h5>
                        <p class="card-text" th:text="${courseOffering.teacherReadOnlyDTO.teacherAM} + ' - ' + ${courseOffering.teacherReadOnlyDTO.firstname} + ' ' + ${courseOffering.teacherReadOnlyDTO.lastname}"></p>
                        <p class="card-text" th:text="${courseOffering.semesterReadOnlyDTO.name} + ' ' + ${courseOffering.semesterReadOnlyDTO.year}"></p>
                        <div sec:authorize="hasRole('STUDENT')">
                            <form method="post" th:action="@{/course-offerings/enroll/{uuid}(uuid=${courseOffering.uuid})}">
                                <button type="submit" class="btn"
                                        th:classappend="${courseOffering.isStudentEnrolled ? 'btn-secondary' : 'btn-primary'}"
                                        th:disabled="${courseOffering.isStudentEnrolled}">Enroll
                                </button>
                            </form>
                        </div>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/course-offerings/edit/{uuid}(uuid=${courseOffering.uuid})}">
                                <button class="btn btn-light">Edit</button>
                            </a>
                            <form method="post" th:action="@{/course-offerings/delete/{uuid}(uuid=${courseOffering.uuid})}">
                                <button type="submit" class="btn btn-light">Delete</button>
                            </form>
                            <a th:href="@{/course-offerings/{uuid}/student-enroll(uuid=${courseOffering.uuid})}">
                                <button class="btn btn-primary">Enroll a student</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="pagination-controls">
        <div th:if="${page.first} AND ${!(page.hasContent)}">No course offerings found.</div>

        <a th:if="${!page.first}" th:href="@{/course-offerings/view(page=0, size=${page.size})}">&laquo;</a>
        <span th:if="${page.first}" class="disabled">&laquo;</span>

        <a th:if="${!page.first}" th:href="@{/course-offerings/view(page=${page.number - 1}, size=${page.size})}">&lsaquo;</a>
        <span th:if="${page.first}" class="disabled">&lsaquo;</span>

        <span th:text="${page.number + 1}"></span>

        <a th:if="${!page.last}" th:href="@{/course-offerings/view(page=${page.number + 1}, size=${page.size})}">&rsaquo;</a>
        <span th:if="${page.last}" class="disabled">&rsaquo;</span>

        <a th:if="${!page.last}" th:href="@{/course-offerings/view(page=${page.totalPages - 1}, size=${page.size})}">&raquo;</a>
        <span th:if="${page.last}" class="disabled">&raquo;</span>
