<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="~{/css/global.css}">
    <title>Enroll Student - CatBridge</title>
</head>
<body>

<div class="container mt-5 main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary-green text-white">
                    <div class="card-title fs-3 mb-0" th:text="Enroll student to course offering"></div>
                </div>

                <div th:if="${errorMessage}" class="error">
                    <p th:text="${errorMessage}"></p>
                </div>

                <form
                        method="post"
                        th:action="@{/course-offerings/{courseOfferingUuid}/student-enroll(courseOfferingUuid = ${courseOfferingUuid})}"
                >
                    <input type="hidden" th:field="*{courseOfferingUuid}"/>
                    <div class="mb-3">
                        <label class="form-label">Student AM</label><br>
                        <input type="text" name="studentAM" class="form-control" required/>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="submit-btn">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
