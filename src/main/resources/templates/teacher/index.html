<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" th:href=@{/css/global.css}>
    <title>Dashboard - CatBridge</title>
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div th:if="${successMessage}">
    <p th:text="${successMessage}"></p>
</div>
<div class="w-15 text-center ms-3 mt-3">
    <a th:href="@{/teachers/edit/{uuid}(uuid=${teacherReadOnlyDTO.uuid})}">
        <button class="reverse-btn text-decoration-none">Edit</button>
    </a>
</div>

<div class="container w-70">

    <div class="fs-2 fw-semibold">
        Hello, <span th:text="${teacherReadOnlyDTO.firstname}"></span> 👋
    </div>
    <hr/>

    <div class="row mb-4">
            <div class="col-4" th:each="courseOffering : ${courseOfferings}">
                <div class="card mb-3 h-250px">
                    <div class="card-body d-flex flex-column justify-between">
                        <div>
                            <div class="card-title fw-semibold fs-5" th:text="${courseOffering.courseReadOnlyDTO.name}"></div>
                            <div class="card-subtitle fg-3" th:text="${courseOffering.courseReadOnlyDTO.code}"></div>
                            <div class="card-text">
                                ECTS: <span th:text="${courseOffering.courseReadOnlyDTO.ects}"></span>
                            </div>
                        </div>
                        <a href="#" class="pt-2">View Course</a>
                    </div>
                </div>
            </div>
    </div>
</div>
</body>
</html>
