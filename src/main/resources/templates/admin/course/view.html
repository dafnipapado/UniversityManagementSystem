<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <a th:href="@{/courses/create}" class="btn btn-light btn-lg px-4 btn-success-custom">
        <i class="bi bi-person-plus me-2"></i>Add a new course
    </a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>Ects</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="course : ${courses}">
                <td th:text="${course.code}"></td>
                <td th:text="${course.name}"></td>
                <td th:text="${course.description}"></td>
                <td th:text="${course.ects}"></td>
                <td th:text="${course.departmentName}"></td>
                <td>
                    <a th:href="@{/courses/edit/{uuid}(uuid=${course.uuid})}">
                        <button class="btn btn-light">Edit</button>
                    </a>
                    <form method="post" th:action="@{/courses/delete/{uuid}(uuid=${course.uuid})}">
                        <button type="submit" class="btn btn-light">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination-controls">
        <div th:if="${page.first} AND ${!(page.hasContent)}">No courses found.</div>

        <a th:if="${!page.first}" th:href="@{/courses/view(page=0, size=${page.size})}">&laquo;</a>
        <span th:if="${page.first}" class="disabled">&laquo;</span>

        <a th:if="${!page.first}" th:href="@{/courses/view(page=${page.number - 1}, size=${page.size})}">&lsaquo;</a>
        <span th:if="${page.first}" class="disabled">&lsaquo;</span>

        <span th:text="${page.number + 1}"></span>

        <a th:if="${!page.last}" th:href="@{/courses/view(page=${page.number + 1}, size=${page.size})}">&rsaquo;</a>
        <span th:if="${page.last}" class="disabled">&rsaquo;</span>

        <a th:if="${!page.last}" th:href="@{/courses/view(page=${page.totalPages - 1}, size=${page.size})}">&raquo;</a>
        <span th:if="${page.last}" class="disabled">&raquo;</span>
    </div>
</body>
</html>
