<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Manage Courses - CatBridge</title>
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <div class="container w-70 mt-5">
        <a th:href="@{/courses/create}" class="reverse-btn text-decoration-none">
            <span class="fa-solid fa-book-open"></span> Add a new course
        </a>

        <table class="table mt-5 align-middle">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Ects</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr class="h-93px" th:classappend="${course.deleted} ? 'deleted-row' : ''" th:each="course : ${courses}">
                    <td class="w-8" th:text="${course.code}"></td>
                    <td class="w-20" th:text="${course.name}"></td>
                    <td class="w-41">
                        <div style="max-height:76px;overflow-y:auto;" class="p-1" th:text="${course.description}"></div>
                    </td>
                    <td class="w-8 ps-3" th:text="${course.ects}"></td>
                    <td class="w-15" th:text="${course.departmentName}"></td>
                    <td class="w-8">
                        <a th:href="@{/courses/edit/{uuid}(uuid=${course.uuid})}" class=" text-decoration-none">
                            <span class="fa-regular fa-pen-to-square submit-btn px-2"></span>
                        </a>
                        <form class="d-inline-block" method="post" th:action="@{/courses/delete/{uuid}(uuid=${course.uuid})}">
                            <button type="submit" class=" submit-btn px-2 py-1">
                                <span class="fa-regular fa-trash-can"></span>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>


        <div th:replace="~{fragments/pagination :: paginationFragment(page=${page}, baseUrl='/courses/view', emptyMessage='No courses found.')}"></div>
    </div>
</body>
</html>
