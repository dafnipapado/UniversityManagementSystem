<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <form
        method="post"
        th:action="@{/users/create}"
        th:object="${userInsertDTO}"
    >
        <div class="mb-3">
            <label th:for="username" class="form-label">Username</label><br>
            <input type="text" th:field="*{username}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label th:for="password" class="form-label">Password</label><br>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label th:for="role" class="form-label">Role</label><br>
            <select id="role" th:field="*{roleId}" class="form-select" required>
                <option value="" selected>Choose a role</option>
                <option th:each="role : ${roleReadOnlyDTO}" th:text="${role.name}" th:value="${role.id}"></option>
            </select>
        </div>
        <div>
            <button type="submit" class="btn btn-outline-dark">Save user</button>
        </div>
    </form>
</body>
</html>
