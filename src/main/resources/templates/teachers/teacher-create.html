<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create New Teacher</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
<!--    <link rel="stylesheet" th:href="@{/css/header.css}">-->
<!--    <link rel="stylesheet" th:href="@{/css/footer.css}">-->
<!--    <link rel="stylesheet" th:href="@{/css/main.css}">-->
<!--    <link rel="stylesheet" th:href="@{/css/userinsert.css}">-->
    <!-- Responsive meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <div class="container mt-5 main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="card-title mb-0">Sign up</h2>
                </div>

                <div th:if="${errorMessage}" class="error">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="card-body">
                    <form method="post" th:object="${teacherInsertDTO}" th:action="@{/teachers/create}" >
                        <!-- First name -->
                        <div class="mb-3">
                            <label class="form-label">First name</label>
                            <input type="text" class="form-control" th:field="*{userInfoInsertDTO.firstname}" required>
                            <div th:if="${#fields.hasErrors('userInfoInsertDTO.firstname')}">
                                <p th:classappend="${#fields.hasErrors('userInfoInsertDTO.firstname')} ? 'error'" th:errors="*{userInfoInsertDTO.firstname}"></p>
                            </div>
                        </div>
                        <!-- Last name -->
                        <div class="mb-3">
                            <label class="form-label">Last name</label>
                            <input type="text" class="form-control" th:field="*{userInfoInsertDTO.lastname}" required>
                            <div th:if="${#fields.hasErrors('userInfoInsertDTO.lastname')}">
                                <p th:classappend="${#fields.hasErrors('userInfoInsertDTO.lastname')} ? 'error'" th:errors="*{userInfoInsertDTO.lastname}"></p>
                            </div>
                        </div>
                        <!-- email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="text" class="form-control" th:field="*{userInfoInsertDTO.email}" required>
                            <div th:if="${#fields.hasErrors('userInfoInsertDTO.email')}">
                                <p th:classappend="${#fields.hasErrors('userInfoInsertDTO.email')} ? 'error'" th:errors="*{userInfoInsertDTO.email}"></p>
                            </div>
                        </div>
                        <!-- teacher am -->
                        <div class="mb-3">
                            <label class="form-label">Teacher AM</label>
                            <input type="text" class="form-control" th:field="*{teacherAM}" required>
                            <div th:if="${#fields.hasErrors('teacherAM')}">
                                <p th:classappend="${#fields.hasErrors('teacherAM')} ? 'error'" th:errors="*{teacherAM}"></p>
                            </div>
                        </div>
                        <!-- afm -->
                        <div class="mb-3">
                            <label class="form-label">Afm</label>
                            <input type="text" class="form-control" th:field="*{userInfoInsertDTO.afm}" required>
                            <div th:if="${#fields.hasErrors('userInfoInsertDTO.afm')}">
                                <p th:classappend="${#fields.hasErrors('userInfoInsertDTO.afm')} ? 'error'" th:errors="*{userInfoInsertDTO.afm}"></p>
                            </div>
                        </div>
                        <!-- telephone -->
                        <div class="mb-3">
                            <label class="form-label">telephone number</label>
                            <input type="text" class="form-control" th:field="*{userInfoInsertDTO.telephone}" required>
                            <div th:if="${#fields.hasErrors('userInfoInsertDTO.telephone')}">
                                <p th:classappend="${#fields.hasErrors('userInfoInsertDTO.telephone')} ? 'error'" th:errors="*{userInfoInsertDTO.telephone}"></p>
                            </div>
                        </div>
                        <!-- Zip Code -->
                        <div class="mb-3">
                            <label class="form-label">Zip Code</label>
                            <input type="text" class="form-control" th:field="*{userInfoInsertDTO.zipCode}" required>
                            <div th:if="${#fields.hasErrors('userInfoInsertDTO.zipCode')}">
                                <p th:classappend="${#fields.hasErrors('userInfoInsertDTO.zipCode')} ? 'error'" th:errors="*{userInfoInsertDTO.zipCode}"></p>
                            </div>
                        </div>
                        <!-- Region -->
                        <div class="mb-3">
                            <label th:for="region" class="form-label">Region</label>
                            <select th:field="*{userInfoInsertDTO.regionId}" class="form-select" id="region" required>
                                <option value="" selected>Select Region</option>
                                <option th:each="region : ${regionsReadOnlyDTO}" th:value="${region.id}" th:text="${region.name}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('userInfoInsertDTO.regionId')}">
                                <p th:classappend="${#fields.hasErrors('userInfoInsertDTO.regionId')} ? 'error'" th:errors="*{userInfoInsertDTO.regionId}"></p>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
