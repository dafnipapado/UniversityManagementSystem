<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Admin dashboard</title>
</head>
<body>

<div th:replace="~{fragments/header :: headerFragment}"></div>

<div th:if="${successMessage}">
    <p th:text="${successMessage}"></p>
</div>
<br>

<div class="container w-70">
    <div class="d-flex justify-content-between mb-5 mt-4">
        <div class="d-flex flex-fill justify-content-center align-items-end gap-3 border-end">
            <span class="bi bi-people fs-4 bg-secondary h-48px w-48px rounded-circle d-flex justify-content-center align-items-center text-white"></span>
            <div class="d-flex flex-column">
                <span class="text-secondary small">Users</span>
                <span th:text="${usersCount}" class="display-5 fw-semibold text-primary-green"></span>
            </div>
        </div>
        <div class="d-flex flex-fill justify-content-center align-items-end gap-3 border-end">
            <span class="bi bi-person-video3 fs-4 bg-secondary h-48px w-48px rounded-circle d-flex justify-content-center align-items-center text-white"></span>
            <div class="d-flex flex-column">
                <span class="text-secondary small">Teachers</span>
                <span th:text="${teachersCount}" class="display-5 fw-semibold text-primary-green"></span>
            </div>
        </div>
        <div class="d-flex flex-fill justify-content-center align-items-end gap-3 border-end">
            <span class="bi bi-mortarboard fs-4 bg-secondary h-48px w-48px rounded-circle d-flex justify-content-center align-items-center text-white"></span>
            <div class="d-flex flex-column">
                <span class="text-secondary small">Students</span>
                <span th:text="${studentsCount}" class="display-5 fw-semibold text-primary-green"></span>
            </div>
        </div>
        <div class="d-flex flex-fill justify-content-center align-items-end gap-3 border-end">
            <span class="bi bi-book fs-4 bg-secondary h-48px w-48px rounded-circle d-flex justify-content-center align-items-center text-white"></span>
            <div class="d-flex flex-column">
                <span class="text-secondary small">Courses</span>
                <span th:text="${coursesCount}" class="display-5 fw-semibold text-primary-green"></span>
            </div>
        </div>
        <div class="d-flex flex-fill justify-content-center align-items-end gap-3">
            <span class="bi bi-collection fs-4 bg-secondary h-48px w-48px rounded-circle d-flex justify-content-center align-items-center text-white"></span>
            <div class="d-flex flex-column">
                <span class="text-secondary small">Course Offerings</span>
                <span th:text="${courseOfferingsCount}" class="display-5 fw-semibold text-primary-green"></span>
            </div>
        </div>
    </div>

    <div class="mb-5 pt-3">
        <div class="fs-4 fw-semibold mb-3">Academic</div>
        <div class="d-flex align-items-center bg-white border border-grey rounded-3 p-3 mb-3">
            <div class="w-30 text-primary-green fs-5 fw-semibold">
                <span class="bi bi-collection me-2"></span>
                <span>Course Offerings</span>
            </div>
            <div th:if="${latestCourseOffering != null}" class="flex-grow-1">
                <span class="text-secondary">Last added:</span>
                <span th:text="${latestCourseOffering.courseCode}"></span>
            </div>
            <a th:href="@{/course-offerings/admin-view}" class="submit-btn text-decoration-none w-15 text-center">Manage</a>
        </div>
        <div class="d-flex justify-content-between align-items-center bg-white border border-grey rounded-3 p-3 mb-3">
            <div class="w-30 text-primary-green fs-5 fw-semibold">
                <span class="bi bi-book me-2"></span>
                <span>Courses</span>
            </div>
            <div th:if="${latestCourse != null}"  class="flex-grow-1">
                <span class="text-secondary">Last added:</span>
                <span th:text="${latestCourse.code}"></span> - <span th:text="${latestCourse.name}"></span>
            </div>
            <a th:href="@{/courses/view}" class="submit-btn text-decoration-none w-15 text-center">Manage</a>
        </div>
        <div class="d-flex justify-content-between align-items-center bg-white border border-grey rounded-3 p-3 mb-3">
            <div class="w-30 text-primary-green fs-5 fw-semibold">
                <span class="bi bi-calendar-week me-2"></span>
                <span>Semesters</span>
            </div>
            <div th:if="${activeSemester != null}" class="flex-grow-1">
                <span class="text-secondary">Active semester:</span>
                <span th:text="${activeSemester.name}"></span>
                <span th:text="${activeSemester.year}"></span>
            </div>
            <a th:href="@{/semesters/view}" class="submit-btn text-decoration-none w-15 text-center">Manage</a>
        </div>
    </div>

    <div class="">
        <div class="fs-4 fw-semibold mb-3">People</div>
        <div class="d-flex justify-content-between align-items-center bg-white border border-grey rounded-3 p-3 mb-3">
            <div class="w-30 text-primary-green fs-5 fw-semibold">
                <span class="bi bi-people me-2"></span>
                <span>Users</span>
            </div>
            <div th:if="${latestUser != null}" class="flex-grow-1">
                <span class="text-secondary">Last added:</span>
                <span th:text="${latestUser.username}"></span>
                [<span th:text="${latestUser.role}" class="text-uppercase"></span>]
            </div>
            <a th:href="@{/users/view}" class="submit-btn text-decoration-none w-15 text-center">Manage</a>
        </div>
        <div class="d-flex justify-content-between align-items-center bg-white border border-grey rounded-3 p-3 mb-3">
            <div class="w-30 text-primary-green fs-5 fw-semibold">
                <span class="bi bi-person-video3 me-2"></span>
                <span>Teachers</span>
            </div>
            <div th:if="${latestTeacher != null}" class="flex-grow-1">
                <span class="text-secondary">Last added:</span>
                <span th:text="${latestTeacher.firstname}"></span>
                <span th:text="${latestTeacher.lastname}"></span>
            </div>
            <a th:href="@{/teachers/view}" class="submit-btn text-decoration-none w-15 text-center">Manage</a>
        </div>
        <div class="d-flex justify-content-between align-items-center bg-white border border-grey rounded-3 p-3 mb-3">
            <div class="w-30 text-primary-green fs-5 fw-semibold">
                <span class="bi bi-mortarboard me-2"></span>
                <span>Students</span>
            </div>
            <div th:if="${latestStudent != null}" class="flex-grow-1">
                <span class="text-secondary">Last added:</span>
                <span th:text="${latestStudent.firstname}"></span>
                <span th:text="${latestStudent.lastname}"></span>
            </div>
            <a th:href="@{/students/view}" class="submit-btn text-decoration-none w-15 text-center">Manage</a>
        </div>
    </div>
</div>


</body>
</html>
