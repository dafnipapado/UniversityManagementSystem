<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create New Teacher</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
<!--    <link rel="stylesheet" th:href="@{/css/header.css}">-->
<!--    <link rel="stylesheet" th:href="@{/css/footer.css}">-->
<!--    <link rel="stylesheet" th:href="@{/css/main.css}">-->
<!--    <link rel="stylesheet" th:href="@{/css/userinsert.css}">-->
    <!-- Responsive meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<!--<div th:replace="~{fragments/header :: headerFragment}"></div>-->

<div class="container mt-5 main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="card-title mb-0">Create New User</h2>
                </div>

                <div th:if="${errorMessage}" class="error">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="card-body">
                    <form method="post" th:object="${teacherInsertDTO}" th:action="@{/teachers/register}" >
                        <!-- First name -->
                        <div class="mb-3">
                            <label th:for="firstname" class="form-label">First name</label>
                            <input type="text" class="form-control" th:field="*{firstname}" required>
                            <div th:if="${#fields.hasErrors('firstname')}">
                                <p th:classappend="${#fields.hasErrors('firstname')} ? 'error'" th:errors="*{firstname}"></p>
                            </div>
                        </div>
                        <!-- Last name -->
                        <div class="mb-3">
                            <label th:for="lastname" class="form-label">Last name</label>
                            <input type="text" class="form-control" th:field="*{lastname}" required>
                            <div th:if="${#fields.hasErrors('lastname')}">
                                <p th:classappend="${#fields.hasErrors('lastname')} ? 'error'" th:errors="*{lastname}"></p>
                            </div>
                        </div>
                        <!-- Username Field -->
                        <div class="mb-3">
                            <label th:for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" th:field="*{username}" required>
                            <div th:if="${#fields.hasErrors('username')}">
                                <p th:classappend="${#fields.hasErrors('username')} ? 'error'" th:errors="*{username}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label th:for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" required>
                            <div th:if="${#fields.hasErrors('password')}">
                                <p th:classappend="${#fields.hasErrors('password')} ? 'error'" th:errors="*{password}"></p>
                            </div>
                        </div>
                        <!-- email -->
                        <div class="mb-3">
                            <label th:for="email" class="form-label">Email</label>
                            <input type="text" class="form-control" th:field="*{email}" required>
                            <div th:if="${#fields.hasErrors('email')}">
                                <p th:classappend="${#fields.hasErrors('email')} ? 'error'" th:errors="*{email}"></p>
                            </div>
                        </div>
                        <!-- teacher am -->
                        <div class="mb-3">
                            <label th:for="teacherAM" class="form-label">Teacher AM</label>
                            <input type="text" class="form-control" th:field="*{teacherAM}" required>
                            <div th:if="${#fields.hasErrors('teacherAM')}">
                                <p th:classappend="${#fields.hasErrors('teacherAM')} ? 'error'" th:errors="*{teacherAM}"></p>
                            </div>
                        </div>
                        <!-- afm -->
                        <div class="mb-3">
                            <label th:for="afm" class="form-label">Afm</label>
                            <input type="text" class="form-control" th:field="*{afm}" required>
                            <div th:if="${#fields.hasErrors('afm')}">
                                <p th:classappend="${#fields.hasErrors('afm')} ? 'error'" th:errors="*{afm}"></p>
                            </div>
                        </div>
                        <!-- telephone -->
                        <div class="mb-3">
                            <label th:for="telephone" class="form-label">telephone number</label>
                            <input type="text" class="form-control" th:field="*{telephone}" required>
                            <div th:if="${#fields.hasErrors('telephone')}">
                                <p th:classappend="${#fields.hasErrors('telephone')} ? 'error'" th:errors="*{telephone}"></p>
                            </div>
                        </div>
                        <!-- Zip Code -->
                        <div class="mb-3">
                            <label th:for="zipCode" class="form-label">Zip Code</label>
                            <input type="text" class="form-control" th:field="*{zipCode}" required>
                            <div th:if="${#fields.hasErrors('zipCode')}">
                                <p th:classappend="${#fields.hasErrors('zipCode')} ? 'error'" th:errors="*{zipCode}"></p>
                            </div>
                        </div>
                        <!-- Region -->
                        <div class="mb-3">
                            <label th:for="region" class="form-label">Region</label>
                            <select th:field="*{regionId}" class="form-select" id="region" required>
                                <option value="" selected>Select Region</option>
                                <option th:each="region : ${regionsReadOnlyDTO}" th:value="${region.id}" th:text="${region.name}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('regionId')}">
                                <p th:classappend="${#fields.hasErrors('regionId')} ? 'error'" th:errors="*{regionId}"></p>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Create Teacher</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footerFragment}"></div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
