<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <form
        method="post"
        th:action="@{/semesters/create}"
        th:object="${semesterInsertDTO}"
    >
        <div class="mb-3">
            <label th:for="name" class="form-label">Name</label><br>
            <input type="text" th:field="*{name}" class="form-control" required>
            <div th:if="${#fields.hasErrors('name')}">
                <p th:classappend="${#fields.hasErrors('name')} ? 'error'" th:errors="*{name}"></p>
            </div>
        </div>
        <div class="mb-3">
            <label th:for="year" class="form-label">Year</label><br>
            <input type="number" th:field="*{year}" class="form-control" required>
            <div th:if="${#fields.hasErrors('year')}">
                <p th:classappend="${#fields.hasErrors('year')} ? 'error'" th:errors="*{year}"></p>
            </div>
        </div>
        <div>
            <button type="submit" class="btn btn-outline-dark">Create semester</button>
        </div>
    </form>
</body>
</html>
